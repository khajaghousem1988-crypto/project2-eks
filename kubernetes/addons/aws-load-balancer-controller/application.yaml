apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
spec:
  project: default
 
  source:
    repoURL: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    targetRevision: "1.14.0"
    helm:
      valuesObject:
        clusterName: banking-eks-dev-cluster
        region: us-east-1
        vpcId: vpc-09bad8c32ee7962c7
 
        replicaCount: 2
 
        serviceAccount:
          create: false
          name: aws-load-balancer-controller
 
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
 
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
